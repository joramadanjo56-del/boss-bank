services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boss_bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boss_bank}
      POSTGRES_DB: ${POSTGRES_DB:-boss_bank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - boss_bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boss_bank} -d ${POSTGRES_DB:-boss_bank}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  boss_bank_data: